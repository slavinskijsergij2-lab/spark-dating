name: Auto-Heal

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      check_token:
        description: "Only verify that RAILWAY_TOKEN can reach the Railway API (no restarts)"
        type: boolean
        default: false

jobs:
  heal:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      ENV_ID: 8ce5561d-c672-4617-b8c7-67f38b996da0
      PROJECT_ID: 02aa4531-33a3-4517-95dd-2a992b112294
      APP_SERVICE_ID: c9803c33-415a-4891-83a6-087c0126f814

    steps:
      - name: Verify Railway token
        if: inputs.check_token
        run: |
          [ -z "$RAILWAY_TOKEN" ] && { echo "::error::RAILWAY_TOKEN secret is not set"; exit 1; }
          for hdr in "Project-Access-Token: $RAILWAY_TOKEN" "Authorization: Bearer $RAILWAY_TOKEN"; do
            out=$(curl -s -X POST "https://backboard.railway.com/graphql/v2" -H "$hdr" -H "Content-Type: application/json" \
              -d "{\"query\":\"{ project(id: \\\"$PROJECT_ID\\\") { name } }\"}")
            if echo "$out" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if (d.get('data') or {}).get('project') else 1)" 2>/dev/null; then
              echo "Token OK via '${hdr%%:*}'"; exit 0
            fi
          done
          echo "::error::Railway API rejected the token: $out"; exit 1

      - name: Check health
        if: ${{ !inputs.check_token }}
        id: check
        run: |
          response=""
          for url in "https://spark-dating.club/health" "https://spark-dating-production.up.railway.app/health"; do
            # /health answers 503 with a JSON body when degraded, so don't use curl -f
            response=$(curl -s --max-time 15 "$url" 2>/dev/null) && echo "$response" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null && break
            response=""
          done

          if [ -z "$response" ]; then
            echo "state=down" >> $GITHUB_OUTPUT
            echo "reason=Сайт не отвечает" >> $GITHUB_OUTPUT
            exit 0
          fi

          read -r status db redis <<< "$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'), d.get('db','?'), d.get('redis','?'))")"
          echo "status=$status db=$db redis=$redis"
          if [ "$status" = "ok" ]; then
            echo "state=ok" >> $GITHUB_OUTPUT
          else
            echo "state=degraded" >> $GITHUB_OUTPUT
            echo "reason=db=$db redis=$redis" >> $GITHUB_OUTPUT
            [ "$db" != "True" ] && echo "restart_app=true" >> $GITHUB_OUTPUT
            [ "$redis" != "True" ] && echo "restart_redis=true" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Restart services
        if: ${{ !inputs.check_token && steps.check.outputs.state != 'ok' && env.RAILWAY_TOKEN != '' }}
        run: |
          # Project tokens use the Project-Access-Token header, account/team tokens use Bearer.
          gql() {
            for hdr in "Project-Access-Token: $RAILWAY_TOKEN" "Authorization: Bearer $RAILWAY_TOKEN"; do
              out=$(curl -s -X POST "https://backboard.railway.com/graphql/v2" \
                -H "$hdr" -H "Content-Type: application/json" -d "$1")
              if echo "$out" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('data') and not d.get('errors') else 1)" 2>/dev/null; then
                echo "$out"; return 0
              fi
            done
            echo "Railway API error: $out" >&2
            return 1
          }
          redeploy() {
            gql "{\"query\":\"mutation { serviceInstanceRedeploy(environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$1\\\") }\"}" >/dev/null \
              && echo "Redeploy $2: OK" || echo "Redeploy $2: FAILED"
          }

          if [ "${{ steps.check.outputs.state }}" = "down" ] || [ "${{ steps.check.outputs.restart_app }}" = "true" ]; then
            redeploy "$APP_SERVICE_ID" spark-dating
          fi
          if [ "${{ steps.check.outputs.restart_redis }}" = "true" ]; then
            redis_id=$(gql "{\"query\":\"{ project(id: \\\"$PROJECT_ID\\\") { services { edges { node { id name } } } } }\"}" \
              | python3 -c "import sys,json; e=json.load(sys.stdin)['data']['project']['services']['edges']; print(next((s['node']['id'] for s in e if s['node']['name']=='Redis-EU'),''))")
            [ -n "$redis_id" ] && redeploy "$redis_id" Redis-EU || echo "Redis-EU service not found"
          fi

      - name: Wait and verify recovery
        if: ${{ !inputs.check_token && steps.check.outputs.state != 'ok' }}
        run: |
          sleep 90
          for i in 1 2 3; do
            st=$(curl -s --max-time 15 "https://spark-dating.club/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null)
            echo "Check $i: status=$st"
            [ "$st" = "ok" ] && echo "recovered=true" >> $GITHUB_ENV && break
            sleep 30
          done

      - name: Notify — healed
        if: ${{ !inputs.check_token && steps.check.outputs.state != 'ok' && env.recovered == 'true' && env.NTFY_TOPIC != '' }}
        run: |
          curl -s -H "Title: Spark Dating — авто-восстановление" -H "Priority: default" -H "Tags: white_check_mark,robot" \
            -d "Проблема обнаружена и исправлена автоматически. Сайт снова работает." "https://ntfy.sh/${NTFY_TOPIC}"

      - name: Notify — still broken
        if: ${{ !inputs.check_token && steps.check.outputs.state != 'ok' && env.recovered != 'true' && env.NTFY_TOPIC != '' }}
        run: |
          curl -s -H "Title: Spark Dating — требуется внимание" -H "Priority: urgent" -H "Tags: rotating_light,warning" \
            -d "Автовосстановление не помогло. Нужна ручная проверка. (${{ steps.check.outputs.reason }})" "https://ntfy.sh/${NTFY_TOPIC}"
