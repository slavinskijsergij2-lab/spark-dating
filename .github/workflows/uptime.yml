name: Uptime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check /health
        run: |
          # Try custom domain first, fall back to Railway URL
          for url in "https://spark-dating.club/health" "https://spark-dating-production.up.railway.app/health"; do
            response=$(curl -sf --max-time 15 "$url" 2>/dev/null) && break || response=""
          done
          if [ -z "$response" ]; then
            echo "::error::Site unreachable on both URLs"
            exit 1
          fi
          echo "Response: $response"
          status=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))")
          echo "Status: $status"
          if [ "$status" != "ok" ]; then
            echo "::error::Site unhealthy — status=$status"
            exit 1
          fi
          echo "OK — app is healthy"
