name: Uptime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check /health
        id: health
        run: |
          for url in "https://spark-dating.club/health" "https://spark-dating-production.up.railway.app/health"; do
            response=$(curl -sf --max-time 15 "$url" 2>/dev/null) && break || response=""
          done

          if [ -z "$response" ]; then
            echo "::error::Site unreachable on both URLs"
            echo "healthy=false" >> $GITHUB_OUTPUT
            echo "reason=Site unreachable" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Response: $response"

          status=$(echo "$response"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'))")
          db=$(echo "$response"        | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('db','?'))")
          photo_wr=$(echo "$response"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('photos',{}).get('writable','?'))")
          photo_ps=$(echo "$response"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('photos',{}).get('persistent','?'))")
          sentry=$(echo "$response"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sentry','?'))")

          echo "status=$status"     ; echo "status=$status"     >> $GITHUB_OUTPUT
          echo "db=$db"             ; echo "db=$db"             >> $GITHUB_OUTPUT
          echo "photo_wr=$photo_wr" ; echo "photo_wr=$photo_wr" >> $GITHUB_OUTPUT
          echo "sentry=$sentry"

          FAIL=0

          if [ "$status" != "ok" ]; then
            echo "::error::App unhealthy (status=$status, db=$db)"
            echo "healthy=false"                >> $GITHUB_OUTPUT
            echo "reason=status=$status db=$db" >> $GITHUB_OUTPUT
            FAIL=1
          fi

          if [ "$photo_wr" = "False" ]; then
            echo "::error::Photo storage not writable — uploads broken!"
            echo "healthy=false"                     >> $GITHUB_OUTPUT
            echo "reason=Photo storage not writable" >> $GITHUB_OUTPUT
            FAIL=1
          fi

          # Soft warnings — log but don't fail the run
          if [ "$photo_ps" = "False" ]; then
            echo "::warning::Photos NOT persistent — will be lost on redeploy!"
          fi
          if [ "$sentry" = "False" ]; then
            echo "::warning::Sentry not configured — errors invisible in prod"
          fi

          if [ $FAIL -eq 1 ]; then exit 1; fi

          echo "healthy=true" >> $GITHUB_OUTPUT
          echo "✓ Site is healthy"

      - name: Notify Telegram on failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          REASON="${{ steps.health.outputs.reason }}"
          [ -z "$REASON" ] && REASON="Site unreachable"
          MSG="🚨 *Spark Dating — сайт упал!*%0A%0A❌ ${REASON}%0A%0AПроверь: https://spark-dating.club%0ARailway: https://railway.app"
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=Markdown" > /dev/null

      - name: Notify Telegram on recovery
        if: success() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          # Send recovery only if the previous run had failed
          PREV=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/uptime.yml/runs?per_page=2" \
            | python3 -c "import sys,json; runs=json.load(sys.stdin).get('workflow_runs',[]); print(runs[1]['conclusion'] if len(runs)>1 else 'success')" 2>/dev/null || echo "success")
          if [ "$PREV" = "failure" ]; then
            MSG="✅ *Spark Dating — сайт восстановлен!*%0A%0AСайт снова работает нормально."
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=Markdown" > /dev/null
          fi
