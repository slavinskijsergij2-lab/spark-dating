name: Uptime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Check /health
        id: health
        run: |
          for url in "https://spark-dating.club/health" "https://spark-dating-production.up.railway.app/health"; do
            # /health answers 503 with a JSON body when degraded, so don't use curl -f
            response=$(curl -s --max-time 15 "$url" 2>/dev/null)
            echo "$response" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null && break
            response=""
          done

          if [ -z "$response" ]; then
            echo "reason=Сайт недоступен" >> $GITHUB_OUTPUT
            echo "healthy=false"          >> $GITHUB_OUTPUT
            exit 1
          fi

          status=$(echo "$response"   | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'))")
          db=$(echo "$response"       | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('db','?'))")
          photo_wr=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('photos',{}).get('writable','?'))")
          photo_ps=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('photos',{}).get('persistent','?'))")
          sentry=$(echo "$response"   | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sentry','?'))")
          redis=$(echo "$response"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('redis','?'))")

          echo "db=$db photo_wr=$photo_wr sentry=$sentry"
          FAIL=0; REASON=""

          if [ "$status" != "ok" ]; then
            REASON="Сервер нездоров (status=$status, db=$db, redis=$redis)"
            echo "::error::$REASON"
            FAIL=1
          fi
          if [ "$photo_wr" = "False" ]; then
            REASON="Хранилище фото недоступно — загрузка фото сломана"
            echo "::error::$REASON"
            FAIL=1
          fi
          if [ "$photo_ps" = "False" ]; then
            echo "::warning::Фото не персистентны — пропадут при редеплое"
          fi
          if [ "$sentry" = "False" ]; then
            echo "::warning::Sentry не настроен"
          fi

          echo "reason=${REASON}" >> $GITHUB_OUTPUT
          echo "healthy=$([ $FAIL -eq 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          [ $FAIL -eq 1 ] && exit 1
          echo "✓ Healthy"

      - name: Notify — site down
        if: failure() && env.NTFY_TOPIC != ''
        run: |
          REASON="${{ steps.health.outputs.reason }}"
          [ -z "$REASON" ] && REASON="Сайт недоступен"
          curl -s \
            -H "Title: 🚨 Spark Dating упал!" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            -d "$REASON" \
            "https://ntfy.sh/${NTFY_TOPIC}"

      - name: Notify — site recovered
        if: success() && env.NTFY_TOPIC != ''
        run: |
          PREV=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/uptime.yml/runs?per_page=2" \
            | python3 -c "import sys,json; runs=json.load(sys.stdin).get('workflow_runs',[]); print(runs[1]['conclusion'] if len(runs)>1 else 'success')" 2>/dev/null || echo "success")
          if [ "$PREV" = "failure" ]; then
            curl -s \
              -H "Title: ✅ Spark Dating восстановлен" \
              -H "Priority: default" \
              -H "Tags: white_check_mark" \
              -d "Сайт снова работает нормально." \
              "https://ntfy.sh/${NTFY_TOPIC}"
          fi
