name: Weekly Security Scan

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: pip install -r requirements.txt pip-audit

      - name: CVE scan
        id: scan
        run: |
          python -m pip_audit --local -f json -o /tmp/audit.json 2>&1 || true
          python3 - <<'PYEOF'
          import json, os, sys

          try:
              data = json.load(open("/tmp/audit.json"))
          except Exception:
              print("No audit output.")
              sys.exit(0)

          found = [
              (d["name"], d["version"], d.get("vulns", []))
              for d in data.get("dependencies", [])
              if d.get("vulns")
          ]

          if not found:
              print("✓ No CVEs found.")
              sys.exit(0)

          lines = ["⚠ CVEs found:\n"]
          for name, ver, vulns in found:
              for v in vulns:
                  fix = v.get("fix_versions") or []
                  fix_str = f" → fix: {', '.join(fix)}" if fix else ""
                  lines.append(f"  {name}=={ver}: {v['id']}{fix_str}")

          msg = "\n".join(lines)
          print(msg)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write(msg + "\n")
          sys.exit(1)
          PYEOF

      - name: Notify via ntfy
        if: failure() && env.NTFY_TOPIC != ''
        run: |
          curl -s \
            -H "Title: 🛡 Spark Dating — найдены CVE" \
            -H "Priority: high" \
            -H "Tags: shield,warning" \
            -d "Еженедельный скан нашёл уязвимости. Проверь GitHub Actions." \
            "https://ntfy.sh/${NTFY_TOPIC}"
